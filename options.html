<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tidy Tabs settings</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 32px 16px; font-size: 14px; }
    main { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 20px; }
    h1 img { width: 32px; height: 32px; }
    .card { padding: 16px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <main>
    <h1><img src="icons/icon48.png" alt="">Tidy Tabs settings</h1>

    <section class="card">
      <h2>Group suggestions</h2>
      <p>When a site has this many tabs outside a group, the toolbar icon shows a badge and the popup suggests grouping them.</p>
      <label class="row" style="margin-top: 10px">
        <span>Suggest a group from</span>
        <span><input type="number" id="groupThreshold" min="2"> tabs</span>
      </label>
    </section>

    <section class="card">
      <h2>Grouped sites</h2>
      <p>New tabs on these sites join their group automatically.</p>
      <ul class="list" id="groupSites"></ul>
    </section>

    <section class="card">
      <h2>Ignored sites</h2>
      <p>These sites are never suggested.</p>
      <ul class="list" id="ignoredSites"></ul>
    </section>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
